[project]
name = "jinai-agents"
version = "0.1.0"
description = "Describe an agent, Claude builds it as Python, Jinai runs it on schedule and keeps it working"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pydantic>=2.6", "sqlalchemy>=2.0",
  "croniter>=2.0", "beautifulsoup4>=4.12", "cryptography>=42", "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
test = ["pytest>=8"]

[project.scripts]
jinai-agents = "jinai_agents.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jinai_agents*"]

[tool.setuptools.package-data]
jinai_agents = ["sandbox/*.py", "sandbox/jinai/*.py"]
